# Configuración de referencia para los nodos Meshtastic del proyecto.
# Basada en la configuración actual del equipo, SIN claves ni contraseñas.
# Aplicar con:  meshtastic --configure meshtastic.example.yaml
# Las claves (security.privateKey/publicKey) las genera cada nodo: no se versionan.
canned_messages: SOS|Herido|Atrapado|Necesito agua|Necesito medicina|Estoy bien|Evacuando
config:
  bluetooth:
    enabled: true
    mode: RANDOM_PIN          # evitar PIN fijo conocido (antes 123456)
  device:
    buzzerGpio: 21
    nodeInfoBroadcastSecs: 10800
  display:
    screenOnSecs: 600
    wakeOnTapOrMotion: true
  lora:
    region: ANZ               # 915–928 MHz, compatible con la banda libre en Colombia
    usePreset: true
    bandwidth: 250
    spreadFactor: 11
    codingRate: 5
    hopLimit: 3
    sx126xRxBoostedGain: true
    txEnabled: true
    txPower: 30               # verificar límite de la ANE y la potencia real del módulo
  position:
    gpsMode: ENABLED
    gpsUpdateInterval: 120
    positionBroadcastSecs: 3600
    positionBroadcastSmartEnabled: true
    broadcastSmartMinimumDistance: 100
    broadcastSmartMinimumIntervalSecs: 300
    positionFlags: 811
  power:
    lsSecs: 300
    minWakeSecs: 10
    waitBluetoothSecs: 60
  security:
    serialEnabled: true       # necesario para que el gateway hable con el servidor por USB
module_config:
  cannedMessage:
    enabled: true
  externalNotification:
    enabled: true
    active: true
    alertMessage: true
    alertMessageBuzzer: true
    nagTimeout: 15
    output: 36
    outputBuzzer: 21
    outputMs: 1000
    usePwm: true
  mqtt:
    enabled: false            # red cerrada: nada sale a mqtt.meshtastic.org
  telemetry:
    deviceUpdateInterval: 900 # reportar batería cada 15 min al servidor
