; Firmware de la red de emergencia FSK 915 MHz (RFM69HCW + RadioHead RHMesh).
;
;   pio run -e gateway_esp32s3 -t upload        gateway del puesto de mando (dirección 1, USB al PC)
;   pio run -e nodo_esp32 -t upload             nodo de albergue con portal Wi-Fi
;
; Cada nodo de albergue necesita una dirección distinta (2-254): cambiar NODE_ADDRESS y
; NODE_NAME en build_flags antes de cargarlo, o crear un entorno por nodo.

[platformio]
default_envs = gateway_esp32s3, nodo_esp32

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    mikem/RadioHead@^1.120
    bblanchon/ArduinoJson@^7.2.1

; Gateway ESP32-S3: USB nativo (CDC) hacia el servidor del puesto de mando.
[env:gateway_esp32s3]
board = esp32-s3-devkitc-1
build_src_filter = +<gateway/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DNODE_ADDRESS=1
    -DNODE_NAME='"Puesto de mando"'

; Nodo de albergue ESP32 DevKit V1: portal Wi-Fi + radio FSK + medición de energía.
[env:nodo_esp32]
board = esp32dev
build_src_filter = +<nodo/>
build_flags =
    -DNODE_ADDRESS=2
    -DNODE_NAME='"Albergue Coliseo"'

; Ejemplo de un segundo nodo (copiar y cambiar dirección y nombre).
[env:nodo_esp32_3]
board = esp32dev
build_src_filter = +<nodo/>
build_flags =
    -DNODE_ADDRESS=3
    -DNODE_NAME='"Albergue Chipre"'

; ESP32-C6: requiere Arduino-ESP32 3.x, que la plataforma oficial de PlatformIO aún no trae.
; Usar el fork pioarduino, p. ej.:
; [env:nodo_esp32c6]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; board = esp32-c6-devkitc-1
; build_src_filter = +<nodo/>
; build_flags = -DNODE_ADDRESS=4 -DNODE_NAME='"Ladera Aranjuez"'
