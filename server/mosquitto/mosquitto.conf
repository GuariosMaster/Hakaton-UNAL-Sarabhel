# Broker local del sistema. La red es cerrada (sin internet) y el puerto solo
# se publica en 127.0.0.1, por eso se permite acceso anónimo. Si se expone el
# broker a la LAN, crear usuarios con mosquitto_passwd y poner allow_anonymous false.
listener 1883
allow_anonymous true

# Persistencia: los mensajes QoS 1 sobreviven a un reinicio del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
