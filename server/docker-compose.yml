# Sistema de mensajería de emergencia — Equipo Sarabhel
# Stack liviano para un portátil con batería: Mosquitto + servicios Python + SQLite.
#
#   docker compose up -d --build                     # modo simulado (sin radio)
#   MESH_USB_DEVICE=/dev/ttyACM0 docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d
#                                                    # gateway ESP32-S3 + RFM69HCW por USB (Linux)

name: sarabhel

x-env: &env
  MQTT_HOST: mosquitto
  MQTT_PORT: "1883"
  DB_PATH: /data/sarabhel.db
  TZ: America/Bogota
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Compartido con el dashboard para marcar la UI cuando los datos son simulados.
  MESH_CONNECTION: ${MESH_CONNECTION:-sim}

x-app: &app
  build: .
  image: sarabhel:latest
  restart: unless-stopped
  volumes:
    - datos:/data
  depends_on:
    mosquitto:
      condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    # Sin ports: el broker solo existe dentro de la red de Compose.
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  listener:
    <<: *app
    command: ["python", "-m", "sarabhel.listener"]
    environment:
      <<: *env
      MESH_CONNECTION: ${MESH_CONNECTION:-sim}
      MESH_USB_BAUD: ${MESH_USB_BAUD:-115200}

  mensajeria:
    <<: *app
    command: ["python", "-m", "sarabhel.messaging"]
    environment: *env

  localizacion:
    <<: *app
    command: ["python", "-m", "sarabhel.location"]
    environment: *env

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1 || ollama pull \"$$OLLAMA_MODEL\""
    restart: "no"

  triaje:
    <<: *app
    command: ["python", "-m", "sarabhel.triage"]
    environment:
      <<: *env
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECS: ${OLLAMA_TIMEOUT_SECS:-20}
      TRIAGE_ENABLED: ${TRIAGE_ENABLED:-1}
    depends_on:
      mosquitto:
        condition: service_healthy
      ollama:
        condition: service_healthy

  dashboard:
    <<: *app
    command: ["python", "-m", "sarabhel.dashboard"]
    environment:
      <<: *env
      TILE_URL: ${TILE_URL:-}
      WEB_DIR: /app/web
      DOWNLOADS_DIR: /app/descargas
    volumes:
      - datos:/data
      # Página /descargar y APK de la app móvil (descarga sin internet en el puesto de mando)
      - ../web:/app/web:ro
      - ./descargas:/app/descargas:ro
    ports:
      # Visible en la red local del puesto de mando (celulares / otros PC).
      - "8080:8080"

volumes:
  datos:
  mosquitto-data:
  ollama-data:
