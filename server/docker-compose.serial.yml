# Override para conectar el Gateway Meshtastic por USB en Linux (Ubuntu).
# Uso:
#   MESH_SERIAL_DEVICE=/dev/ttyUSB0 docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d
# (En Windows/macOS Docker Desktop no puede pasar puertos COM: ejecuta el listener nativo, ver README.)

services:
  listener:
    devices:
      - "${MESH_SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyMESH"
    environment:
      MESH_CONNECTION: serial
      MESH_SERIAL_PORT: /dev/ttyMESH
