# Override para conectar el Gateway Meshtastic por USB en Linux (Ubuntu/Arch).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d --build
# El gateway conectado en este puesto es /dev/ttyACM0. Si el dispositivo aparece
# con otro nombre, sobreescribir MESH_SERIAL_DEVICE.
# (En Windows/macOS Docker Desktop no puede pasar puertos COM: ejecuta el listener nativo, ver README.)

services:
  listener:
    devices:
      - "${MESH_SERIAL_DEVICE:-/dev/ttyACM0}:/dev/ttyMESH"
    # El nodo del dispositivo pertenece al grupo de la UART del host. Consultar su GID con:
    #   stat -c %g /dev/ttyACM0
    group_add:
      - "${MESH_SERIAL_GID:-984}"
    environment:
      MESH_CONNECTION: serial
      MESH_SERIAL_PORT: /dev/ttyMESH

  dashboard:
    # El banner DEMO se desactiva solo cuando el dashboard ve el modo real.
    environment:
      MESH_CONNECTION: serial
